<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RiderHub Pro</title>
  
  <!-- ไอคอนแอปเมื่อบันทึกลงหน้าจอมือถือ -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3097/3097180.png">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3097/3097180.png" type="image/png">
  
  <!-- ตั้งค่า Fullscreen PWA บนมือถือ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07090e">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #07090e;
    }
    
    /* กล่องครอบ iframe */
    .app-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    /* 
      เทคนิคตัดแถบเตือนสีขาวของ Google:
      เลื่อนขอบบนขึ้นไป 45px และขยายความสูงชดเชย 45px
      ทำให้แถบเตือนถูกดันหลุดออกนอกจอพอดี 100% 
    */
    iframe {
      width: 100%;
      height: calc(100% + 45px);
      margin-top: -45px;
      border: none;
      display: block;
      background-color: #07090e;
    }
  </style>
</head>
<body>
  <div class="app-viewport">
    <!-- ใส่ URL Web App ของคุณที่ลงท้ายด้วย /exec ในช่อง src ด้านล่างนี้ -->
    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbyJodw4nWq_qb7ta3y7ws0nzB388iCMjO4JWae5psybOC5T-LFsX4fUwfHgPsJqtL4j/exec" 
      allow="fullscreen; geolocation; camera; microphone">
    </iframe>
  </div>
</body>
</html>
