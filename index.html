<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RiderHub Pro</title>
  
  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  
  <!-- Standalone Mobile App Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07090e">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #07090e;
    }
    .app-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      margin-top: 0;
      border: none;
      display: block;
      background-color: #07090e;
    }
  </style>
</head>
<body>
  <div class="app-viewport">
    <iframe 
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbyJodw4nWq_qb7ta3y7ws0nzB388iCMjO4JWae5psybOC5T-LFsX4fUwfHgPsJqtL4j/exec" 
      allow="fullscreen; geolocation; camera; microphone">
    </iframe>
  </div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration error:', err));
      });
    }
  </script>
</body>
</html>
